<!-- GLightbox: modern, dependency-free lightbox (keyboard + button nav, Esc/X to close) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox@3.3.0/dist/css/glightbox.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/glightbox@3.3.0/dist/js/glightbox.min.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    if (window.GLightbox) {
      GLightbox({ selector: '.glightbox', loop: true });
    }
  });
</script>
